[project]
name = "talentscout-ai"
version = "0.1.0"
description = "Local-first voice recruiter using Ollama and MCP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "ollama>=0.4",
  "mcp>=1.28,<2",
  "faster-whisper>=1.1",
  "av>=14.0.0,<19",
  "python-multipart>=0.0.9",
  "ddgs>=9.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pydantic>=2.8",
  "streamlit>=1.40",
  "plotly>=5.24",
  "pandas>=2.2",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
]

[tool.uv]
package = false
